#以下配置来源于自定义配置键
#拦截器配置
handle:
  config:
    #拦截器排除路径
    exclude-url:
      #登录
      - '/user/login/**'
      #注册
      - '/user/register/**'
      #用户退出
      - '/user/logout/**'
      #错误路径
      - '/error/**'
      #错误界面
      - '/cp/error/**'
      #图形验证码
      - '/captcha/captcha/**'
      #检验验证码
      - '/captcha/verify/**'
      #下载文件
      - '/file/download/**'
      #分片下载
      - '/file/downloadChunk/**'
      #获取手机验证码
      - '/user/phoneCode/**'
      #校验手机验证码
      - '/user/checkPhoneCode'
    #静态资源
    static-url:
      - '/favicon.ico'
      - '/swagger-ui/**'
      - '/doc.html'
      - '/webjars/**'
      - '/v2/**' #兼容v2
      - '/v3/**' #兼容v3
      - '/static/**'
      - "/swagger-resources"
      - '/swagger-ui.html' #全新的swagger-ui界面