#数据库配置
spring:
  datasource:
    #连接池
    type: com.alibaba.druid.pool.DruidDataSource
    #连接路径
    url: jdbc:mysql://ubuntu:3306/meituan?characterEncoding=utf-8&serverTimezone=GMT&useSSL=false&allowPublicKeyRetrieval=true
    #驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    #用户名
    username: root
    #密码
    password: 12345678
    # druid 连接池管理
    druid:
      # 初始化时建立物理连接的个数
      initial-size: 5
      # 连接池的最小空闲数量
      min-idle: 5
      # 连接池最大连接数量
      max-active: 20
      # 获取连接时最大等待时间，单位毫秒
      max-wait: 60000
      # 申请连接的时候检测，如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
      test-while-idle: true
      # 既作为检测的间隔时间又作为testWhileIdel执行的依据
      time-between-eviction-runs-millis: 60000
      # 销毁线程时检测当前连接的最后活动时间和当前时间差大于该值时，关闭当前连接(配置连接在池中的最小生存时间)
      min-evictable-idle-time-millis: 30000
      # 用来检测数据库连接是否有效的sql 必须是一个查询语句(oracle中为 select 1 from dual)
      validation-query: select 'x'
      # 申请连接时会执行validationQuery检测连接是否有效,开启会降低性能,默认为true
      test-on-borrow: false
      # 归还连接时会执行validationQuery检测连接是否有效,开启会降低性能,默认为true
      test-on-return: false
      # 是否缓存preparedStatement, 也就是PSCache,PSCache对支持游标的数据库性能提升巨大，比如说oracle,在mysql下建议关闭。
      pool-prepared-statements: false
      # 置监控统计拦截的filters，去掉后监控界面sql无法统计，stat: 监控统计、Slf4j:日志记录、waLL: 防御sqL注入
      filters: stat,wall,slf4j
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true。在Druid中，不会存在Oracle下PSCache占用内存过多的问题，可以把这个数值配置大一些，比如说100
      max-pool-prepared-statement-per-connection-size: -1
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connect-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        # 是否启用StatFilter默认值true
        enabled: true
        # 添加过滤规则
        url-pattern: /*
        # 忽略过滤的格式
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico
      stat-view-servlet:
        # 是否启用StatViewServlet默认值true
        enabled: true
        # 访问路径为/druid时，跳转到StatViewServlet
        url-pattern: /druid/*
        # 是否能够重置数据
        reset-enable: false
        # 需要账号密码才能访问控制台，默认为root
        login-username: druid
        login-password: druid
        # IP白名单
        allow: 127.0.0.1
        # IP黑名单（共同存在时，deny优先于allow）
        deny:
  # Redis单机
  data:
    redis:
      #默认数据库
      database: 3
      #Redis数据库端口
      port: 6379
      #密码
      password: 123456
      #IP地址
      host: ubuntu
      #Redis连接池
      jedis:
        pool:
          #最小空闲数
          min-idle: 0
          #最大空闲数
          max-idle: 8
          #最大等待时间
          max-wait: 5000ms
  # Redis哨兵集群
  # data:
  #   redis:
  #     #主节点密码
  #     password: ${datasource.redis.password:123456}
  #     #哨兵集群
  #     sentinel:
  #       #密码
  #       password: ${datasource.redis.password:123456}
  #       #节点列表
  #       nodes: ${datasource.redis.node.host:linux}:${datasource.redis.node.port:6380}
  #       # 主节点
  #       master: local-master
  cache:
    redis:
      #允许存储null值
      cache-null-values: true
      #使用前缀
      use-key-prefix: true
      #最大超时时间
      time-to-live: 5h
      #启用统计信息
      enable-statistics: true
#Redis时间配置
redis:
  config:
    #时间值(分钟为单位)
    time: 300
#日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    #开启驼峰命名
    map-underscore-to-camel-case: true
  #设置逻辑删除
  global-config:
    db-config:
      id-type: assign_id #雪花算法
      logic-delete-value: 1 #删除
      logic-not-delete-value: 0 #未删除
      logic-delete-field: deleted #全局逻辑删除字段
  #指定mapper.xml的文件路径
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体对象的扫描包
  type-aliases-package: ${datasource.mybatis.type-package:com.chunfeng.entity}
#debug: true